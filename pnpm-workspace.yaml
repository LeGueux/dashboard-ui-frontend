packages:
  - '.'

engineStrict: true

overrides:
  'fontless>esbuild': '0.28.2'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  unrs-resolver: true
  vue-demi: true

ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - maplibre-gl
  - unrs-resolver
  - vue-demi

minimumReleaseAgeExclude:
  - '@iconify-json/lucide@1.2.139'
  - eslint@10.12.0
